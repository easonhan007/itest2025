{{ $image := .Resources.GetMatch "featured-image" }}
<span class="press-cover"><span class="press-cover-label">{{ with .Params.categories }}{{ index . 0 }}{{ else }}工程实践{{ end }}</span>{{ with $image }}<img src="{{ .RelPermalink }}" alt="" loading="lazy" onerror="this.hidden=true" />{{ end }}</span>
